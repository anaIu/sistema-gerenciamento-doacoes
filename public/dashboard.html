<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <main class="content">
        <div class="header">
          <h1>Dashboard</h1>
          <p>Resumo geral do sistema</p>
        </div>

        <div class="cards">
          <div class="card">
            <h3>Usuários</h3>
            <p id="totalUsuarios">-</p>
          </div>

          <div class="card">
            <h3>Doadores</h3>
            <p id="totalDoadores">-</p>
          </div>

          <div class="card">
            <h3>Doações</h3>
            <p id="totalDoacoes">-</p>
          </div>

          <div class="card">
            <h3>Estoque (saldo)</h3>
            <p id="totalEstoque">-</p>
          </div>

          <div class="card">
            <h3>Total Doado</h3>
            <p id="totalDinheiro">-</p>
          </div>
        </div>

        <div class="table-box">
          <h2>Últimas movimentações</h2>
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>Usuário</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
