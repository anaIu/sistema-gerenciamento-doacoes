<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Estoque</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <main class="content">
        <h1>Controle de Estoque</h1>

        <div class="form-box">
          <h2>Registrar Saída</h2>
          <label for="idDoacao">Doação</label>
          <select id="idDoacao">
            <option value="">Selecione uma doação</option>
          </select>
          <input type="number" id="quantidade" placeholder="Quantidade" />
          <input type="text" id="destino" placeholder="Destino" />
          <textarea id="observacao" placeholder="Observação"></textarea>
          <button onclick="registrarSaida()">Registrar Saída</button>
        </div>

        <div class="table-box">
          <h2>Movimentações</h2>
          <table>
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Destino</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/estoque.js"></script>
  </body>
</html>
