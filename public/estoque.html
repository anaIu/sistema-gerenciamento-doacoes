<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Estoque</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <h2>DoeGestão</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="usuarios.html">Usuários</a>
        <a href="doadores.html">Doadores</a>
        <a href="doacoes.html">Doações</a>
        <a href="estoque.html">Estoque</a>
        <a href="historico.html">Histórico</a>
        <a href="javascript:fazerLogout()">Sair</a>
      </aside>

      <main class="content">
        <h1>Controle de Estoque</h1>

        <div class="form-box">
          <h2>Registrar Saída</h2>
          <input type="text" id="idDoacao" placeholder="ID da Doação" />
          <input type="number" id="quantidade" placeholder="Quantidade" />
          <input type="text" id="destino" placeholder="Destino" />
          <textarea id="observacao" placeholder="Observação"></textarea>
          <button onclick="registrarSaida()">Registrar Saída</button>
        </div>

        <div class="table-box">
          <h2>Movimentações</h2>
          <table>
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Destino</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/estoque.js"></script>
  </body>
</html>
