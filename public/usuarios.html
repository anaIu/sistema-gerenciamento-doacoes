<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Usuários</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <main class="content">
        <h1>Gerenciar Usuários</h1>

        <div class="form-box">
          <h2 id="tituloFormulario">Novo Usuário</h2>
          <input type="text" id="nome" placeholder="Nome" />
          <input type="email" id="email" placeholder="E-mail" />
          <input type="password" id="senha" placeholder="Senha (mínimo 8 caracteres com número)" />
          <input type="password" id="confirmarSenha" placeholder="Confirmar senha" />
          <button onclick="cadastrarUsuario()">Cadastrar</button>
          <button id="botaoCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
        </div>

        <div class="table-box">
          <h2>Usuários cadastrados</h2>
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/usuarios.js"></script>
  </body>
</html>
