<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Usuários</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <h2>DoeGestão</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="usuarios.html">Usuários</a>
        <a href="doadores.html">Doadores</a>
        <a href="doacoes.html">Doações</a>
        <a href="estoque.html">Estoque</a>
        <a href="historico.html">Histórico</a>
        <a href="javascript:fazerLogout()">Sair</a>
      </aside>

      <main class="content">
        <h1>Gerenciar Usuários</h1>

        <div class="form-box">
          <h2 id="tituloFormulario">Novo Usuário</h2>
          <input type="text" id="nome" placeholder="Nome" />
          <input type="email" id="email" placeholder="E-mail" />
          <input type="password" id="senha" placeholder="Senha (opcional ao editar)" />
          <select id="perfil">
            <option>Administrador</option>
            <option>Funcionário</option>
          </select>
          <button onclick="cadastrarUsuario()">Cadastrar</button>
          <button id="botaoCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
        </div>

        <div class="table-box">
          <h2>Usuários cadastrados</h2>
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/usuarios.js"></script>
  </body>
</html>
