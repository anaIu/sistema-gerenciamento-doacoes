<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Doadores</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <main class="content">
        <h1>Gerenciar Doadores</h1>

        <div class="form-box">
          <h2 id="tituloFormulario">Novo Doador</h2>
          <input type="text" id="nome" placeholder="Nome" />
          <input type="text" id="telefone" placeholder="Telefone (XX) XXXXX-XXXX" maxlength="15" />
          <input type="email" id="email" placeholder="E-mail" />
          <textarea id="observacao" placeholder="Observação"></textarea>
          <button onclick="cadastrarDoador()">Cadastrar</button>
          <button id="botaoCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
        </div>

        <div class="table-box">
          <h2>Doadores cadastrados</h2>
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/doadores.js"></script>
  </body>
</html>
