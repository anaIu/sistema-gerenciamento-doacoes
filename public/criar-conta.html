<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Criar Conta - Sistema de Doações</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <h1>DoeGestão</h1>
      <p>Crie a conta da sua instituição</p>

      <input type="text" id="nomeOrganizacao" placeholder="Nome da organização" maxlength="255" />
      <input type="text" id="cnpj" placeholder="CNPJ" maxlength="18" />
      <input type="text" id="nome" placeholder="Nome completo" maxlength="255" />
      <input type="email" id="email" placeholder="E-mail" maxlength="255" />
      <input type="text" id="cpf" placeholder="CPF" maxlength="14" />
      <input type="text" id="telefone" placeholder="Telefone" maxlength="15" />
      <input type="password" id="senha" placeholder="Senha (mínimo 8 caracteres com número)" />
      <input type="password" id="confirmarSenha" placeholder="Confirmar senha" />
      <input type="text" name="website" id="website" style="display: none;" />

      <button onclick="criarConta()">Criar conta</button>
      <p style="margin-top: 15px;">
        Já tem conta? <a href="login.html">Fazer login</a>
      </p>
    </div>
    <script src="js/validacoes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/criar-conta.js"></script>
  </body>
</html>
