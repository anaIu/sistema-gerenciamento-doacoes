<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Doações</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <main class="content">
        <h1>Registrar Doação</h1>

        <div class="form-box">
          <h2 id="tituloFormulario">Nova Doação</h2>
          <label for="idDoador">Doador</label>
          <select id="idDoador">
            <option value="">Selecione um doador</option>
          </select>
          <select id="tipo">
            <option>Alimento</option>
            <option>Roupa</option>
            <option>Dinheiro</option>
            <option>Brinquedo</option>
            <option>Outro</option>
          </select>
          <input type="number" id="quantidade" placeholder="Quantidade" />
          <input type="number" id="valor" placeholder="Valor" />
          <textarea id="observacao" placeholder="Observação"></textarea>
          <button onclick="cadastrarDoacao()">Registrar</button>
          <button id="botaoCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
        </div>

        <div class="table-box">
          <h2>Doações registradas</h2>
          <table>
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Valor</th>
                <th>Doador</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/doacoes.js"></script>
  </body>
</html>
