
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Doações</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <main class="content">
        <h1>Registrar Doação</h1>

        <div class="form-box">
          <h2 id="tituloFormulario">Nova Doação</h2>

          <div id="campoDoador">
            <label for="idDoador">Doador</label>
            <select id="idDoador">
              <option value="">Selecione um doador</option>
            </select>
          </div>

          <label for="tipo">Tipo de doação</label>
          <select id="tipo">
            <option value="Alimento">Alimento</option>
            <option value="Roupa">Roupa</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Brinquedo">Brinquedo</option>
            <option value="Outro">Outro</option>
          </select>

          <div id="campoQuantidade">
            <label for="quantidade">Quantidade de itens</label>
            <input
              type="number"
              id="quantidade"
              min="1"
              step="1"
              placeholder="Ex.: 10"
            />
          </div>

          <div id="campoValor" style="display: none;">
            <label for="valor">Valor da doação (R$)</label>
            <input
              type="number"
              id="valor"
              min="0.01"
              step="0.01"
              placeholder="Ex.: 50.00"
            />
          </div>

          <label for="observacao">Observação (opcional)</label>
          <textarea
            id="observacao"
            placeholder="Informações adicionais sobre a doação"
          ></textarea>

          <button id="botaoPrincipal" type="button">
            Registrar
          </button>

          <button
            id="botaoCancelar"
            type="button"
            style="display: none;"
          >
            Cancelar
          </button>
        </div>

        <div class="table-box">
          <h2>Doações registradas</h2>
          <table>
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Valor</th>
                <th>Doador</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/doacoes.js"></script>
  </body>
</html>
